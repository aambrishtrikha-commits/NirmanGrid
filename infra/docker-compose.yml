services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8080"
    env_file:
      - ../.env
    environment:
      - REPO_ROOT=/app
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
